name: Android debug build

on: [push, pull_request]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable
  # Signing with the committed shared debug key only (no secrets, no release key).
  GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/debug.keystore
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # T-02: these versions must be confirmed on the first CI run; they must match
      # what Godot 4.7.2 targets (see docs/OPEN_QUESTIONS.md).
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Cache Godot downloads
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: godot-dl
          key: godot-4.7.2-stable

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot-dl
          cd godot-dl
          base="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl -fsSLO "$base/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSLO "$base/Godot_v4.7.2-stable_export_templates.tpz"
          curl -fsSLO "$base/SHA512-SUMS.txt"

      - name: Verify checksums
        working-directory: godot-dl
        run: |
          grep -E "Godot_v4\.7\.2-stable_(linux\.x86_64\.zip|export_templates\.tpz)$" SHA512-SUMS.txt > wanted.txt
          test "$(wc -l < wanted.txt)" -eq 2
          sha512sum -c wanted.txt

      - name: Install Godot and export templates
        run: |
          cd godot-dl
          unzip -q -o "Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p "$HOME/.local/bin"
          mv "Godot_v4.7.2-stable_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          unzip -q -o "Godot_v4.7.2-stable_export_templates.tpz" -d tpz
          tpl="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$tpl"
          mv tpz/templates/* "$tpl/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Create build directory
        run: mkdir -p build

      - name: Import project
        run: godot --headless --path . --import

      - name: Run tests
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/gladius-debug.apk

      - name: Check APK exists
        run: test -f build/gladius-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gladius-debug-apk
          path: build/gladius-debug.apk
